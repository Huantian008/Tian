<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接雨水 2.0 - Trapping Rain Water II</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel-bg: rgba(255, 255, 255, 0.95);
    --text: #2c3e50;
    --text-secondary: #5a6c7d;
    --accent: #1976d2;
    --gold: #e6a800;
    --danger: #d32f2f;
    --success: #388e3c;
    --border: rgba(0, 0, 0, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  #canvas-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  #grid-canvas {
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    /* cursor: crosshair; */
  }

  /* Cell tooltip */
  #cell-info {
    position: absolute;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    line-height: 1.7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  #cell-info.visible { opacity: 1; }
  #cell-info .coord { color: var(--gold); font-weight: 600; }
  .stat-value {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  /* Control bar */
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }
  #controls button {
    background: #f5f6f8;
    border: 1px solid #d0d5dd;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.2s;
    min-width: 44px;
    text-align: center;
  }
  #controls button:hover { background: #e8ecf1; border-color: #b0b8c4; }
  #controls button:active { transform: scale(0.96); }
  #controls button:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  #controls button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #controls button.warn { background: var(--danger); color: #fff; border-color: var(--danger); }
  #controls .separator { width: 1px; height: 24px; background: #d0d5dd; margin: 0 4px; }
  #controls label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  #controls input[type="range"] { width: 90px; accent-color: var(--accent); }
  #controls select {
    background: #f5f6f8; color: var(--text); border: 1px solid #d0d5dd;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }

  /* Stats bar */
  #stats {
    display: flex;
    gap: 24px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    font-size: 13px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  #stats .stat { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  #stats .stat-value { color: var(--accent); font-weight: 600; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
</style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas id="grid-canvas"></canvas>
    <div id="cell-info">
      <div>📍 坐标: <span class="coord" id="ci-coord">-</span></div>
      <div>📏 高度: <span class="stat-value" id="ci-height">-</span></div>
      <div>💧 积水: <span class="stat-value" id="ci-water">-</span></div>
      <div>✅ 已访问: <span id="ci-visited">-</span></div>
    </div>
  </div>

  <div id="stats">
    <div class="stat">💧 总积水: <span class="stat-value" id="st-water">0</span></div>
    <div class="stat">📦 堆中: <span class="stat-value" id="st-heap">0</span></div>
    <div class="stat">✅ 已访问: <span class="stat-value" id="st-visited">0</span></div>
    <div class="stat">🌊 水位: <span class="stat-value" id="st-level">0</span></div>
    <div class="stat">📋 步骤: <span class="stat-value" id="st-step">0</span></div>
  </div>

  <div id="controls">
    <button id="btn-reset" title="重置 (R)">⏮ 重置</button>
    <button id="btn-back" title="后退 (←)">◀◀</button>
    <button id="btn-play" class="primary" title="播放/暂停 (空格)">▶ 播放</button>
    <button id="btn-forward" title="前进 (→)">⏭</button>
    <button id="btn-finish" title="快进 (F)">▶▶ 快进</button>

    <div class="separator"></div>

    <label>⚡ 速度:
      <input type="range" id="speed-slider" min="1" max="10" value="5" step="1">
    </label>

    <div class="separator"></div>

    <label>📐 网格:
      <select id="grid-size">
        <option value="4">4×4</option>
        <option value="6">6×6</option>
        <option value="8" selected>8×8</option>
        <option value="10">10×10</option>
        <option value="12">12×12</option>
      </select>
    </label>
    <button id="btn-random" class="warn">🔄 随机生成</button>
  </div>

<script>
// ==================== MinHeap ====================
class MinHeap {
  constructor() { this.heap = []; }
  size() { return this.heap.length; }
  push(item) {
    this.heap.push(item);
    this._bubbleUp(this.heap.length - 1);
  }
  pop() {
    if (this.heap.length === 1) return this.heap.pop();
    const top = this.heap[0];
    this.heap[0] = this.heap.pop();
    this._sinkDown(0);
    return top;
  }
  peek() { return this.heap.length > 0 ? this.heap[0] : null; }
  _bubbleUp(i) {
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.heap[i].h >= this.heap[p].h) break;
      [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
      i = p;
    }
  }
  _sinkDown(i) {
    const n = this.heap.length;
    while (true) {
      let s = i;
      const l = (i << 1) + 1, r = (i << 1) + 2;
      if (l < n && this.heap[l].h < this.heap[s].h) s = l;
      if (r < n && this.heap[r].h < this.heap[s].h) s = r;
      if (s === i) break;
      [this.heap[i], this.heap[s]] = [this.heap[s], this.heap[i]];
      i = s;
    }
  }
}

// ==================== RainWaterEngine ====================
class RainWaterEngine {
  constructor(heightMap) {
    this.heightMap = heightMap;
    this.m = heightMap.length;
    this.n = heightMap[0].length;
    this.reset();
  }
  reset() {
    this.visited = Array.from({length: this.m}, () => new Array(this.n).fill(false));
    this.waterMap = Array.from({length: this.m}, () => new Array(this.n).fill(0));
    this.heap = new MinHeap();
    this.waterLevel = 0;
    this.totalWater = 0;
    this.stepHistory = [];
    this.isComplete = false;
    this._initBoundary();
  }
  _initBoundary() {
    if (this.m <= 2 || this.n <= 2) {
      for (let i = 0; i < this.m; i++)
        for (let j = 0; j < this.n; j++)
          this._push(i, j);
      return;
    }
    for (let j = 0; j < this.n; j++) { this._push(0, j); this._push(this.m - 1, j); }
    for (let i = 1; i < this.m - 1; i++) { this._push(i, 0); this._push(i, this.n - 1); }
  }
  _push(r, c) {
    if (this.visited[r][c]) return;
    this.visited[r][c] = true;
    this.heap.push({ r, c, h: this.heightMap[r][c] });
  }
  canAdvance() { return !this.isComplete && this.heap.size() > 0; }
  step() {
    if (this.isComplete) return null;
    if (this.heap.size() === 0) { this.isComplete = true; return { type: 'complete', totalWater: this.totalWater }; }
    const cur = this.heap.pop();
    this.waterLevel = Math.max(this.waterLevel, cur.h);
    const step = {
      type: 'process', cell: { r: cur.r, c: cur.c }, height: cur.h,
      waterLevel: this.waterLevel, neighbors: [], totalWater: this.totalWater,
      heapSize: this.heap.size(), visitedCount: this._countVisited(),
    };
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
      const nr = cur.r + dr, nc = cur.c + dc;
      if (nr < 0 || nr >= this.m || nc < 0 || nc >= this.n) continue;
      if (this.visited[nr][nc]) continue;
      this.visited[nr][nc] = true;
      const nh = this.heightMap[nr][nc];
      const water = Math.max(0, this.waterLevel - nh);
      if (water > 0) { this.waterMap[nr][nc] = water; this.totalWater += water; }
      this.heap.push({ r: nr, c: nc, h: nh });
      step.neighbors.push({ r: nr, c: nc, height: nh, water });
    }
    this.stepHistory.push(step);
    step.totalWater = this.totalWater;
    return step;
  }
  undo() {
    if (this.stepHistory.length === 0) return false;
    const step = this.stepHistory.pop();
    this.isComplete = false;
    this.heap.push({ r: step.cell.r, c: step.cell.c, h: step.height });
    this.waterLevel = this.stepHistory.length > 0 ? this.stepHistory[this.stepHistory.length - 1].waterLevel : 0;
    for (const nb of step.neighbors) {
      this.visited[nb.r][nb.c] = false;
      if (nb.water > 0) { this.waterMap[nb.r][nb.c] = 0; this.totalWater -= nb.water; }
    }
    return true;
  }
  _countVisited() { let c = 0; for (let i = 0; i < this.m; i++) for (let j = 0; j < this.n; j++) if (this.visited[i][j]) c++; return c; }
}

// ==================== 2D Canvas Renderer ====================
class GridRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cellSize = 0;
    this.padding = 0;
    this.highlightCell = null;   // { r, c }
    this.highlightNeighbors = []; // [{ r, c }]
    this.pulsePhase = 0;
    this._animFrame = null;
    this._animate = this._animate.bind(this);
  }

  setGrid(m, n) {
    this.m = m;
    this.n = n;
    this._resize();
  }

  _resize() {
    const wrapper = this.canvas.parentElement;
    const maxW = wrapper.clientWidth - 40;
    const maxH = wrapper.clientHeight - 40;
    const maxCellByW = (maxW - 100) / this.n;  // 100px for legend/labels
    const maxCellByH = (maxH - 100) / this.m;
    this.cellSize = Math.floor(Math.min(maxCellByW, maxCellByH, 80));
    this.padding = 60;
    const w = this.n * this.cellSize + this.padding * 2;
    const h = this.m * this.cellSize + this.padding * 2;
    this.canvas.width = w;
    this.canvas.height = h;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
  }

  _cellX(c) { return this.padding + c * this.cellSize; }
  _cellY(r) { return this.padding + r * this.cellSize; }
  _cellCenterX(c) { return this._cellX(c) + this.cellSize / 2; }
  _cellCenterY(r) { return this._cellY(r) + this.cellSize / 2; }

  heightColor(h, maxH) {
    if (maxH === 0) return { r: 76, g: 175, b: 80 };
    const t = h / maxH;
    // blue(0) → green → yellow → orange → red(max)
    let r, g, b;
    if (t < 0.25) {
      const s = t / 0.25;
      r = Math.round(33 + s * (76 - 33));
      g = Math.round(150 + s * (175 - 150));
      b = Math.round(243 + s * (80 - 243));
    } else if (t < 0.5) {
      const s = (t - 0.25) / 0.25;
      r = Math.round(76 + s * (255 - 76));
      g = Math.round(175 + s * (235 - 175));
      b = Math.round(80 + s * (59 - 80));
    } else if (t < 0.75) {
      const s = (t - 0.5) / 0.25;
      r = Math.round(255 + s * (255 - 255));
      g = Math.round(235 + s * (152 - 235));
      b = Math.round(59 + s * (0 - 59));
    } else {
      const s = (t - 0.75) / 0.25;
      r = Math.round(255 + s * (229 - 255));
      g = Math.round(152 + s * (57 - 152));
      b = Math.round(0 + s * (53 - 0));
    }
    return { r, g, b };
  }

  draw(engine, animTime) {
    const ctx = this.ctx;
    const { m, n, cellSize, padding } = this;
    const w = n * cellSize + padding * 2;
    const h = m * cellSize + padding * 2;
    const maxH = Math.max(...engine.heightMap.flat(), 1);

    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#f8f9fb';
    ctx.fillRect(0, 0, w, h);

    // Draw cells
    for (let r = 0; r < m; r++) {
      for (let c = 0; c < n; c++) {
        const x = this._cellX(c), y = this._cellY(r);
        const hgt = engine.heightMap[r][c];
        const color = this.heightColor(hgt, maxH);

        // Cell fill
        ctx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
        ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);

        // Cell border
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);

        // Height text
        const isDark = (color.r * 0.299 + color.g * 0.587 + color.b * 0.114) < 140;
        ctx.fillStyle = isDark ? '#fff' : '#222';
        ctx.font = `bold ${Math.max(12, cellSize * 0.28)}px 'Segoe UI', system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(hgt, x + cellSize / 2, y + cellSize / 2);

        // Water overlay
        const water = engine.waterMap[r][c];
        if (water > 0) {
          const waterH = Math.min(water / maxH, 1) * cellSize * 0.7;
          const wy = y + cellSize - 2 - waterH;
          ctx.fillStyle = 'rgba(33, 150, 243, 0.55)';
          ctx.fillRect(x + 2, wy, cellSize - 4, waterH);

          // Water amount text
          if (cellSize > 40) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(10, cellSize * 0.22)}px 'Segoe UI', system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`+${water}`, x + cellSize / 2, wy + waterH / 2);
          }
        }

        // Visited marker
        if (engine.visited[r][c]) {
          ctx.strokeStyle = 'rgba(255,255,255,0.7)';
          ctx.lineWidth = 2;
          const mx = x + cellSize * 0.2, my = y + cellSize * 0.2;
          const ms = cellSize * 0.6;
          ctx.beginPath();
          ctx.moveTo(mx + ms * 0.2, my + ms * 0.5);
          ctx.lineTo(mx + ms * 0.45, my + ms * 0.75);
          ctx.lineTo(mx + ms * 0.8, my + ms * 0.25);
          ctx.stroke();
        }
      }
    }

    // Highlight neighbors (blue dashed)
    for (const { r, c } of this.highlightNeighbors) {
      const x = this._cellX(c), y = this._cellY(r);
      ctx.strokeStyle = '#2196f3';
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
      ctx.setLineDash([]);
    }

    // Highlight current cell (gold pulsing)
    if (this.highlightCell) {
      const { r, c } = this.highlightCell;
      const x = this._cellX(c), y = this._cellY(r);
      const pulse = Math.sin(animTime * 4) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255, 183, 0, ${pulse})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = 'rgba(255, 183, 0, 0.6)';
      ctx.shadowBlur = 12;
      ctx.strokeRect(x, y, cellSize, cellSize);
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    // Row/col labels
    ctx.fillStyle = '#8899aa';
    ctx.font = '12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(i, this._cellCenterX(i), padding - 20);
    }
    for (let i = 0; i < m; i++) {
      ctx.fillText(i, padding - 20, this._cellCenterY(i));
    }

    // Legend
    const lx = padding, ly = h - padding + 20;
    const lw = n * cellSize / 5;
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const color = this.heightColor(Math.round(t * maxH), maxH);
      ctx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
      ctx.fillRect(lx + i * lw, ly, lw, 14);
    }
    ctx.fillStyle = '#556';
    ctx.font = '11px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`0`, lx, ly + 16);
    ctx.textAlign = 'right';
    ctx.fillText(`${maxH}`, lx + 5 * lw, ly + 16);
    ctx.textAlign = 'center';
    ctx.fillText('高度', lx + 2.5 * lw, ly + 16);
  }

  setHighlightCell(r, c) { this.highlightCell = { r, c }; }
  setHighlightNeighbors(neighbors) { this.highlightNeighbors = neighbors || []; }
  clearHighlights() { this.highlightCell = null; this.highlightNeighbors = []; }

  getCellFromMouse(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const c = Math.floor((mx - this.padding) / this.cellSize);
    const r = Math.floor((my - this.padding) / this.cellSize);
    if (r >= 0 && r < this.m && c >= 0 && c < this.n) return { r, c };
    return null;
  }

  startAnimation() {
    if (this._animFrame) return;
    this._animate();
  }

  _animate() {
    this._animFrame = requestAnimationFrame(this._animate);
    this.pulsePhase += 0.05;
  }

  stopAnimation() {
    if (this._animFrame) { cancelAnimationFrame(this._animFrame); this._animFrame = null; }
  }
}

// ==================== UIController ====================
class UIController {
  constructor(engine, renderer, onGenerate) {
    this.engine = engine;
    this.renderer = renderer;
    this.onGenerate = onGenerate;
    this.isPlaying = false;
    this.playTimer = null;
    this.speed = 200;
    this._animTime = 0;

    this._bindElements();
    this._bindEvents();
    this._startRenderLoop();
    this._updateStats();
    this._updateButtons();
  }

  _bindElements() {
    this.els = {};
    const ids = ['btn-reset','btn-back','btn-play','btn-forward','btn-finish','btn-random',
      'speed-slider','grid-size','st-water','st-heap','st-visited','st-level','st-step',
      'cell-info','ci-coord','ci-height','ci-water','ci-visited'];
    for (const id of ids) this.els[id] = document.getElementById(id);
  }

  _bindEvents() {
    this.els['btn-reset'].addEventListener('click', () => this._reset());
    this.els['btn-back'].addEventListener('click', () => this._back());
    this.els['btn-play'].addEventListener('click', () => this._togglePlay());
    this.els['btn-forward'].addEventListener('click', () => this._forward());
    this.els['btn-finish'].addEventListener('click', () => this._finish());
    this.els['btn-random'].addEventListener('click', () => this._randomGenerate());
    this.els['grid-size'].addEventListener('change', () => this._randomGenerate());
    this.els['speed-slider'].addEventListener('input', () => {
      this.speed = 1000 - (this.els['speed-slider'].value - 1) * 100;
    });
    this.speed = 1000 - (this.els['speed-slider'].value - 1) * 100;

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case ' ': e.preventDefault(); this._togglePlay(); break;
        case 'ArrowRight': this._forward(); break;
        case 'ArrowLeft': this._back(); break;
        case 'r': case 'R': this._reset(); break;
        case 'f': case 'F': this._finish(); break;
      }
    });

    this.renderer.canvas.addEventListener('click', (e) => {
      const cell = this.renderer.getCellFromMouse(e);
      if (cell) this._showCellInfo(cell.r, cell.c);
    });

    this.renderer.canvas.addEventListener('mousemove', (e) => {
      const cell = this.renderer.getCellFromMouse(e);
      if (cell) {
        this.els['cell-info'].style.left = (e.clientX - this.renderer.canvas.getBoundingClientRect().left + 18) + 'px';
        this.els['cell-info'].style.top = (e.clientY - this.renderer.canvas.getBoundingClientRect().top - 80) + 'px';
        this._showCellInfo(cell.r, cell.c);
      }
    });

    this.renderer.canvas.addEventListener('mouseleave', () => {
      this.els['cell-info'].classList.remove('visible');
    });
  }

  _startRenderLoop() {
    const loop = () => {
      this._animTime = performance.now() * 0.001;
      this.renderer.draw(this.engine, this._animTime);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  _reset() {
    this._stopPlay();
    this.engine.reset();
    this.renderer.clearHighlights();
    this._updateStats();
    this._updateButtons();
  }

  _back() {
    this._stopPlay();
    if (this.engine.undo()) {
      this.renderer.clearHighlights();
      this._updateStats();
      this._updateButtons();
    }
  }

  _forward() {
    if (!this.engine.canAdvance()) return;
    const step = this.engine.step();
    if (!step || step.type === 'complete') { this._updateStats(); this._updateButtons(); return; }
    this.renderer.setHighlightCell(step.cell.r, step.cell.c);
    this.renderer.setHighlightNeighbors(step.neighbors);
    this._updateStats();
    this._updateButtons();
  }

  _togglePlay() { this.isPlaying ? this._stopPlay() : this._startPlay(); }

  _startPlay() {
    if (!this.engine.canAdvance()) return;
    this.isPlaying = true;
    this.els['btn-play'].textContent = '⏸ 暂停';
    this._playLoop();
  }

  _stopPlay() {
    this.isPlaying = false;
    if (this.playTimer) clearTimeout(this.playTimer);
    this.playTimer = null;
    this.els['btn-play'].textContent = '▶ 播放';
  }

  _playLoop() {
    if (!this.isPlaying) return;
    if (!this.engine.canAdvance()) { this._stopPlay(); this._updateButtons(); return; }
    const step = this.engine.step();
    if (step && step.type === 'complete') { this._stopPlay(); this._updateStats(); this._updateButtons(); return; }
    if (step) {
      this.renderer.setHighlightCell(step.cell.r, step.cell.c);
      this.renderer.setHighlightNeighbors(step.neighbors);
      this._updateStats();
    }
    this.playTimer = setTimeout(() => this._playLoop(), this.speed);
  }

  _finish() {
    this._stopPlay();
    while (this.engine.canAdvance()) this.engine.step();
    this.renderer.clearHighlights();
    this._updateStats();
    this._updateButtons();
  }

  _randomGenerate() {
    this._stopPlay();
    const size = parseInt(this.els['grid-size'].value);
    this.onGenerate(size);
    this.renderer.clearHighlights();
    this._updateStats();
    this._updateButtons();
  }

  _updateStats() {
    this.els['st-water'].textContent = this.engine.totalWater;
    this.els['st-heap'].textContent = this.engine.heap.size();
    this.els['st-visited'].textContent = this.engine._countVisited();
    this.els['st-level'].textContent = this.engine.waterLevel;
    this.els['st-step'].textContent = this.engine.stepHistory.length;
  }

  _updateButtons() {
    this.els['btn-forward'].disabled = !this.engine.canAdvance();
    this.els['btn-finish'].disabled = !this.engine.canAdvance();
    this.els['btn-back'].disabled = this.engine.stepHistory.length === 0;
  }

  _showCellInfo(r, c) {
    this.els['ci-coord'].textContent = `(${r}, ${c})`;
    this.els['ci-height'].textContent = this.engine.heightMap[r][c];
    this.els['ci-water'].textContent = this.engine.waterMap[r][c];
    this.els['ci-visited'].textContent = this.engine.visited[r][c] ? '✅ 是' : '❌ 否';
    this.els['cell-info'].classList.add('visible');
    clearTimeout(this._cellInfoTimer);
    this._cellInfoTimer = setTimeout(() => this.els['cell-info'].classList.remove('visible'), 2000);
  }
}

// ==================== Main ====================
function generateRandomHeightMap(size) {
  const map = [];
  for (let i = 0; i < size; i++) {
    map[i] = [];
    for (let j = 0; j < size; j++) {
      const distFromEdge = Math.min(i, j, size - 1 - i, size - 1 - j);
      const baseHeight = 1 + Math.floor(Math.random() * 8);
      const edgeBias = distFromEdge === 0 ? Math.floor(Math.random() * 4) + 2 : 0;
      map[i][j] = Math.min(9, Math.max(0, baseHeight + edgeBias - distFromEdge));
    }
  }
  return map;
}

let engine, renderer, ui;

function init() {
  const canvas = document.getElementById('grid-canvas');
  const size = 8;
  const heightMap = generateRandomHeightMap(size);
  engine = new RainWaterEngine(heightMap);

  renderer = new GridRenderer(canvas);
  renderer.setGrid(size, size);
  renderer.startAnimation();

  ui = new UIController(engine, renderer, (newSize) => {
    const newMap = generateRandomHeightMap(newSize);
    engine = new RainWaterEngine(newMap);
    renderer.setGrid(newSize, newSize);
    ui.engine = engine;
    ui._updateStats();
    ui._updateButtons();
  });
}

init();
</script>
